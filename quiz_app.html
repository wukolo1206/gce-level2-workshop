<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Certified Educator Level 2 官方 25 題線上模擬刷題 App (GCE 第 2 級：測驗 A)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --accent: #34a853;
      --warning: #fbbc04;
      --danger: #ea4335;
      --dark: #202124;
      --light-bg: #f8f9fa;
      --border: #dadce0;
      --text: #3c4043;
      --text-muted: #5f6368;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', 'Outfit', sans-serif; }

    body { background: var(--light-bg); color: var(--text); padding-bottom: 60px; }

    header {
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      color: white;
      padding: 24px 32px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(26, 115, 232, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-title h1 { font-size: 1.4rem; font-weight: 700; }
    .brand-title p { font-size: 0.88rem; opacity: 0.9; }

    .lang-switcher {
      display: flex;
      background: rgba(255,255,255,0.2);
      padding: 4px;
      border-radius: 20px;
      gap: 4px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: white;
      padding: 6px 14px;
      border-radius: 16px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .lang-btn.active { background: white; color: var(--primary); }

    .container { max-width: 960px; margin: 24px auto; padding: 0 16px; }

    .dashboard-card {
      background: white;
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .stat-item { text-align: center; flex: 1; min-width: 120px; }
    .stat-val { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .filter-chip {
      border: 1px solid var(--border);
      background: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    .question-card {
      background: white;
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--primary);
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .q-tag { background: #e8f0fe; color: var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; }
    .q-num { font-weight: 700; color: var(--text-muted); font-size: 0.9rem; }
    
    .q-title { font-size: 1.12rem; font-weight: 600; color: var(--dark); margin-bottom: 18px; line-height: 1.6; }

    .options { display: flex; flex-direction: column; gap: 10px; }

    .option-btn {
      display: flex;
      align-items: flex-start;
      padding: 14px 18px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      text-align: left;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .option-btn:hover { background: #f8f9fa; border-color: var(--primary); }
    .option-btn.correct { background: #e6f4ea; border-color: var(--accent); color: #137333; font-weight: 600; }
    .option-btn.wrong { background: #fce8e6; border-color: var(--danger); color: #c5221f; }

    .opt-label { font-weight: 700; margin-right: 10px; min-width: 24px; }

    .explanation-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 8px;
      background: #e8f0fe;
      border-left: 4px solid var(--primary);
      display: none;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .submit-multi-btn {
      margin-top: 14px;
      padding: 10px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header { padding: 16px; }
      .container { padding: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <h1>Google Certified Educator Level 2 真題刷題系統</h1>
      <p>收錄 GCE 第 2 級：測驗 A (Quiz A) 完整 25 題實務真題與中英雙語切換</p>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn active" id="lang-zh" onclick="setGlobalLang('zh')">繁體中文</button>
      <button class="lang-btn" id="lang-en" onclick="setGlobalLang('en')">English</button>
      <button class="lang-btn" id="lang-bi" onclick="setGlobalLang('bi')">中英對照</button>
    </div>
  </header>

  <div class="container">
    
    <div class="dashboard-card">
      <div class="stat-item">
        <div class="stat-val" id="total-count">25</div>
        <div class="stat-label">總題數</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="answered-count">0</div>
        <div class="stat-label">已答題數</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="score-count" style="color:var(--accent);">0 / 25</div>
        <div class="stat-label">得分狀況</div>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-chip active" onclick="filterCategory('all')">全選 (25 題)</button>
      <button class="filter-chip" onclick="filterCategory('Unit 1')">Unit 1: 行政與自動化</button>
      <button class="filter-chip" onclick="filterCategory('Unit 2')">Unit 2: 親師與跨校溝通</button>
      <button class="filter-chip" onclick="filterCategory('Unit 3')">Unit 3: 班級素材與平台</button>
      <button class="filter-chip" onclick="filterCategory('Unit 4')">Unit 4: 互動簡報與會議</button>
      <button class="filter-chip" onclick="filterCategory('Unit 5')">Unit 5: 個人化差異學習</button>
      <button class="filter-chip" onclick="filterCategory('Unit 6')">Unit 6: 數據與評量分析</button>
    </div>

    <div id="questions-list"></div>

  </div>

  <script>
    const rawQuestions = [
  {
    "id": 1,
    "unit": "Unit 2: 親師溝通與跨校合作",
    "title_en": "A teacher wants to build a year-long connection with classrooms in other locations. The teacher has worked with the other teachers to plan out the interactions for the year. How can the teacher ensure all involved can see all the events as well as join and participate?",
    "title_zh": "老師希望與其他地區的班級建立為期一年的交流合作，並已與其他老師共同規劃好全年的互動活動。老師該如何確保所有參與者都能看到所有活動，並順利加入與參與？",
    "options_en": [
      "Add all the dates to a shared Google Doc.",
      "Send an email reminder before each event.",
      "Send the Google Meet link in the Google Chat group.",
      "Schedule all events and invite participants in Google Calendar with a Google Meet."
    ],
    "options_zh": [
      "將所有日期新增至共用的 Google 文件中",
      "在每次活動前發送電子郵件提醒",
      "在 Google Chat 群組中發送 Google Meet 連結",
      "在 Google 行事曆中排定所有活動、邀請參與者並附加 Google Meet 視訊連結"
    ],
    "answer": 3,
    "explanation_zh": "正確答案為：在 Google 行事曆中排定所有活動、邀請參與者並附加 Google Meet。這樣能確保活動同步呈現於所有人的行事曆上，並提供一鍵加入 Meet 視訊的管道。"
  },
  {
    "id": 2,
    "unit": "Unit 3: 班級素材與作品展現",
    "title_en": "A teacher has students work on a project-based learning activity of their choice. Students have taken various subtopics and used different Google tools (Docs, Slides, Youtube) to present the information. The teacher wants to provide a combined space for the students to share their findings of what they have learned. How would this be accomplished?",
    "title_zh": "老師讓學生進行自主選擇的專題式學習 (PBL)。學生選擇了不同的子主題，並使用不同的 Google 工具 (Docs, Slides, YouTube) 來呈現資訊。老師希望提供一個整合空間，讓學生分享他們的學習成果。這該如何實現？",
    "options_en": [
      "Create a Google Site and provide each student with a page to share their work.",
      "Create a Google Site and embed a Google Calendar showing when students will present their work.",
      "Create a Google Site for each student to share their findings with the class.",
      "Create a Google Site and embed a Google Form for students to submit their work."
    ],
    "options_zh": [
      "建立一個 Google 協作平台 (Google Site)，並為每位學生提供一個頁面來分享他們的成果",
      "建立一個 Google 協作平台，並內嵌 Google 行事曆顯示學生何時展示作品",
      "為每位學生分別建立一個 Google 協作平台與全班分享成果",
      "建立一個 Google 協作平台，並內嵌 Google 表單供學生提交作品"
    ],
    "answer": 0,
    "explanation_zh": "正確答案為：建立一個 Google 協作平台並為每位學生提供一個專屬子頁面。Google Sites 是最佳的整合平台，能內嵌 Docs、Slides 與 YouTube 影片。"
  },
  {
    "id": 3,
    "unit": "Unit 1: 自動化課堂與擴充工具",
    "title_en": "An educator would like to give asynchronous verbal feedback to their students on a document that they have submitted. How would the educator achieve this?",
    "title_zh": "教育工作者希望對學生提交的文件提供非同步的口頭 (語音) 回饋。教育工作者該如何實現此目標？",
    "options_en": [
      "Search for an add-on from the Google Workspace Marketplace.",
      "Send a message to the students using Chat.",
      "Leave a private comment in Classroom.",
      "Create a meeting invite to the students using Calendar."
    ],
    "options_zh": [
      "從 Google Workspace Marketplace 搜尋並安裝擴充功能 (Add-on，如 Mote)",
      "使用 Google Chat 發送訊息給學生",
      "在 Google Classroom 中留下私人註解",
      "使用 Google Calendar 建立會議邀請"
    ],
    "answer": 0,
    "explanation_zh": "正確答案為：從 Google Workspace Marketplace 搜尋擴充功能（例如 Mote 語音回饋擴充功能），可在 Docs 中直接錄製並留下口頭語音回饋。"
  },
  {
    "id": 4,
    "unit": "Unit 1: 自動化行政與智慧畫布",
    "title_en": "An educator is supervising a school project and has created a Google Doc to manage the agenda for a group of students. Which Smart chips would be used to assign specific tasks to students and set deadlines for each task within the document?",
    "title_zh": "教育工作者正在指導一項學校專案，並建立了 Google 文件來管理小組學生的議程。若要在文件中將特定任務指派給學生並為每項任務設定截止日期，應使用哪些智慧標籤 (Smart chips)？",
    "options_en": [
      "People and File",
      "File and Date",
      "Date and Place",
      "People and Date"
    ],
    "options_zh": [
      "人員與檔案 (People and File)",
      "檔案與日期 (File and Date)",
      "日期與地點 (Date and Place)",
      "人員與日期 (People and Date)"
    ],
    "answer": 3,
    "explanation_zh": "正確答案為：人員與日期 (People and Date)。使用 @姓名 指派負責學生，使用 @日期 設定任務截止日期。"
  },
  {
    "id": 5,
    "unit": "Unit 4: 互動學習與遠距會議",
    "title_en": "A team is collaborating on Google Meet, but one member's access to the internet is intermittent. What feature would allow the person to participate fully in the audio conversation?",
    "title_zh": "團隊正在使用 Google Meet 進行協作，但其中一位成員的網路連線不穩定。什麼功能可以讓該成員完全參與語音對話？",
    "options_en": [
      "Join by phone",
      "Call control",
      "Noise cancellation",
      "Push to talk"
    ],
    "options_zh": [
      "透過電話加入 (Join by phone)",
      "通話控制 (Call control)",
      "雜訊消除 (Noise cancellation)",
      "按鍵發聲 (Push to talk)"
    ],
    "answer": 0,
    "explanation_zh": "正確答案為：透過電話加入 (Join by phone)。當網路不穩定時，成員可撥打 Meet 專用電話號碼連入語音會議。"
  },
  {
    "id": 6,
    "unit": "Unit 3: 班級素材與文件結構",
    "title_en": "An educator is preparing a role play activity in Google Docs. Students will be assigned one of several different roles, each with specific instructions. The educator wants to create a clear and organized document, allowing students to easily navigate to their designated part using a table of contents. Which feature must be used in the document for the table of contents to function correctly?",
    "title_zh": "教師正在 Google 文件中準備角色扮演活動。學生將被指派不同角色，每個角色都有具體說明。教師希望建立結構清晰的文件，讓學生能透過目錄輕鬆跳轉至指定部分。文件中必須使用什麼功能才能使目錄正常發揮作用？",
    "options_en": [
      "Bullets & numbering",
      "Paragraph styles",
      "Page numbers",
      "Headers & footers"
    ],
    "options_zh": [
      "項目符號與編號 (Bullets & numbering)",
      "段落樣式 (Paragraph styles，如標題1、標題2)",
      "頁碼 (Page numbers)",
      "頁首與頁尾 (Headers & footers)"
    ],
    "answer": 1,
    "explanation_zh": "正確答案為：段落樣式 (Paragraph styles)。Google Docs 的目錄是自動根據段落樣式中的標題階層 (Headings) 產生的。"
  },
  {
    "id": 7,
    "unit": "Unit 5: 學生個人化與學術誠信",
    "title_en": "A student often forgets to cite their sources and wants to make sure their submission to their teacher will show as being free of plagiarism. Which Google Classroom feature allows the student to double-check their academic integrity?",
    "title_zh": "學生經常忘記註明資料來源，並希望確保向老師提交的作業不會顯示抄襲。Google Classroom 的哪項功能可讓學生自行檢查學術誠信？",
    "options_en": [
      "Analytics",
      "Add-ons",
      "Originality reports",
      "Rubrics"
    ],
    "options_zh": [
      "數據分析 (Analytics)",
      "擴充功能 (Add-ons)",
      "原創性比對報告 (Originality reports)",
      "評分基準 (Rubrics)"
    ],
    "answer": 2,
    "explanation_zh": "正確答案為：原創性比對報告 (Originality reports)。開啟此功能後，學生在交作業前最多可進行 3 次自我比對，檢查引述與抄襲。"
  },
  {
    "id": 8,
    "unit": "Unit 5: 個人化差異與練習題集",

    "options_en": [
      "Import",
      "Extra help",
      "Skills",
      "More options"
    ],
    "options_zh": [
      "匯入 (Import)",
      "額外協助 / 提示資源 (Extra help)",
      "技能 (Skills)",
      "更多選項 (More options)"
    ],
    "answer": 1,
    "explanation_zh": "正確答案為：額外協助 (Extra help)。在 Practice sets 中，老師可為每題加入多達 10 個提示資源（影片、文字提示等）。"
  },
  {
    "id": 9,
    "unit": "Unit 6: 數據分析與條件式格式",
    "title_en": "An educator uses Google Sheets to track and monitor student progress. They want to visualize the data based on student performance. Which Google Sheets feature should be applied to show different cell appearance based on specific criteria?",

    "options_en": [
      "Conditional Formatting",
      "Autocomplete",
      "Pivot table",
      "Data extraction"
    ],
    "options_zh": [
      "條件式格式設定 (Conditional Formatting)",
      "自動完成 (Autocomplete)",
      "樞紐分析表 (Pivot table)",
      "資料擷取 (Data extraction)"
    ],
    "answer": 0,
    "explanation_zh": "正確答案為：條件式格式設定 (Conditional Formatting)。能根據分數條件（如小於 60 分顯示紅色背景）自動變更儲存格外觀。"
  },
  {
    "id": 10,

    "options_en": [

  {

    "title_zh": "一名學生完成了多頁的研究報告，發現自己在多個地方引用了錯誤的作者姓名。可以使用 Google 文件的哪項功能來定位所有錯誤姓名以便進行修改？",
    "options_en": [

    let currentLang = 'zh';
    let userAnswers = {};
    let currentFilter = 'all';

    function setGlobalLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('lang-' + lang).classList.add('active');
      renderQuestions();
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      renderQuestions();
    }

    function renderQuestions() {
      const container = document.getElementById('questions-list');
      container.innerHTML = '';

      const filtered = rawQuestions.filter(q => {
        if (currentFilter === 'all') return true;
        return q.unit.includes(currentFilter);
      });

      document.getElementById('total-count').innerText = filtered.length;

      filtered.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        let titleText = '';
        if (currentLang === 'zh') titleText = q.title_zh;
        else if (currentLang === 'en') titleText = q.title_en;
        else titleText = '<div style="margin-bottom:8px;"><strong>[EN]</strong> ' + q.title_en + '</div><div><strong>[中]</strong> ' + q.title_zh + '</div>';

        const isMulti = Array.isArray(q.answer);

        let html = `
          <div class="q-header">
            <span class="q-tag">${q.unit} ${isMulti ? '【複選題】' : ''}</span>
            <span class="q-num">Question ${q.id} / 25</span>
          </div>
          <div class="q-title">${titleText}</div>
          <div class="options" id="opts-${q.id}">
        `;

        q.options_zh.forEach((optZh, optIdx) => {
          const optEn = q.options_en[optIdx];
          let optText = '';
          if (currentLang === 'zh') optText = optZh;
          else if (currentLang === 'en') optText = optEn;
          else optText = '<div><strong>[EN]</strong> ' + optEn + '</div><div style="font-size:0.88rem; color:#5f6368;"><strong>[中]</strong> ' + optZh + '</div>';

          const label = String.fromCharCode(65 + optIdx);

          html += `
            <button class="option-btn" id="opt-${q.id}-${optIdx}" onclick="handleSelect(${q.id}, ${optIdx}, ${isMulti})">
              <span class="opt-label">${label}.</span>
              <div>${optText}</div>
            </button>
          `;
        });

        html += `</div>`;

        if (isMulti) {
          html += `<button class="submit-multi-btn" onclick="checkMultiAnswer(${q.id})">確認提交複選答案</button>`;
        }

        html += `
          <div class="explanation-box" id="exp-${q.id}">
            <strong>💡 官方考點與詳細說明：</strong><br>
            ${q.explanation_zh}
          </div>
        `;

        card.innerHTML = html;
        container.appendChild(card);

        if (userAnswers[q.id]) {
          restoreState(q.id, isMulti);
        }
      });

      updateStats();
    }

    function handleSelect(qid, optIdx, isMulti) {
      if (isMulti) {
        if (!userAnswers[qid]) userAnswers[qid] = [];
        const pos = userAnswers[qid].indexOf(optIdx);
        if (pos > -1) userAnswers[qid].splice(pos, 1);
        else userAnswers[qid].push(optIdx);

        document.querySelectorAll(`#opts-${qid} .option-btn`).forEach((btn, idx) => {
          if (userAnswers[qid].includes(idx)) btn.style.borderColor = 'var(--primary)';
          else btn.style.borderColor = 'var(--border)';
        });
      } else {
        userAnswers[qid] = optIdx;
        const q = rawQuestions.find(item => item.id === qid);
        const correct = q.answer;

        document.querySelectorAll(`#opts-${qid} .option-btn`).forEach((btn, idx) => {
          btn.disabled = true;
          if (idx === correct) btn.classList.add('correct');
          if (idx === optIdx && idx !== correct) btn.classList.add('wrong');
        });

        document.getElementById('exp-' + qid).style.display = 'block';
        updateStats();
      }
    }

    function checkMultiAnswer(qid) {
      const q = rawQuestions.find(item => item.id === qid);
      const correctArr = q.answer;
      const userArr = userAnswers[qid] || [];

      document.querySelectorAll(`#opts-${qid} .option-btn`).forEach((btn, idx) => {
        btn.disabled = true;
        if (correctArr.includes(idx)) btn.classList.add('correct');
        if (userArr.includes(idx) && !correctArr.includes(idx)) btn.classList.add('wrong');
      });

      document.getElementById('exp-' + qid).style.display = 'block';
      updateStats();
    }

    function restoreState(qid, isMulti) {
      const q = rawQuestions.find(item => item.id === qid);
      const correct = q.answer;
      const userAns = userAnswers[qid];

      if (isMulti) {
        document.querySelectorAll(`#opts-${qid} .option-btn`).forEach((btn, idx) => {
          btn.disabled = true;
          if (correct.includes(idx)) btn.classList.add('correct');
          if (Array.isArray(userAns) && userAns.includes(idx) && !correct.includes(idx)) btn.classList.add('wrong');
        });
      } else {
        document.querySelectorAll(`#opts-${qid} .option-btn`).forEach((btn, idx) => {
          btn.disabled = true;
          if (idx === correct) btn.classList.add('correct');
          if (idx === userAns && idx !== correct) btn.classList.add('wrong');
        });
      }
      document.getElementById('exp-' + qid).style.display = 'block';
    }

    function updateStats() {
      const answered = Object.keys(userAnswers).length;
      document.getElementById('answered-count').innerText = answered;

      let score = 0;
      Object.keys(userAnswers).forEach(qidStr => {
        const qid = parseInt(qidStr);
        const q = rawQuestions.find(item => item.id === qid);
        const uAns = userAnswers[qid];

        if (Array.isArray(q.answer)) {
          if (Array.isArray(uAns) && uAns.sort().join(',') === q.answer.sort().join(',')) {
            score++;
          }
        } else {
          if (uAns === q.answer) score++;
        }
      });

      document.getElementById('score-count').innerText = score + ' / ' + rawQuestions.length;
    }

    window.onload = renderQuestions;
  </script>
</body>
</html>
